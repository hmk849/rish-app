name: Build Rish iOS Unsigned IPA

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rish-ios-unsigned-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    # 官方项目要求 Apple Silicon 和特定版本的 Xcode。
    # 如果 runner 没有兼容的工具链，工作流会明确失败。
    runs-on: macos-15
    timeout-minutes: 180

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Show build environment
        shell: bash
        run: |
          set -euxo pipefail
          uname -a
          sw_vers
          xcodebuild -version
          xcodebuild -showsdks
          node --version || true
          ruby --version
          git status --short

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.11.0"
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - name: Install build tools
        shell: bash
        run: |
          set -euxo pipefail
          brew install cmake jq perl
          gem install cocoapods

      - name: Verify source checkout
        shell: bash
        run: |
          set -euxo pipefail
          node scripts/verify-source-checkout.mjs

      - name: Install JavaScript dependencies
        shell: bash
        run: |
          set -euxo pipefail
          npm ci --prefix apps/mobile

      - name: Prepare Rish iOS dependency
        shell: bash
        run: |
          set -euxo pipefail
          ./scripts/prepare-rish-ios.sh

      - name: Prepare shared Agent core
        shell: bash
        run: |
          set -euxo pipefail
          ./scripts/prepare-rish-agent-core.sh

      - name: Prepare libgit2 and native dependencies
        shell: bash
        run: |
          set -euxo pipefail
          ./scripts/prepare-libgit2-ios.sh

      - name: Install CocoaPods
        shell: bash
        run: |
          set -euxo pipefail
          cd apps/mobile/ios
          pod install

      - name: Build unsigned iOS device app
        shell: bash
        run: |
          set -euxo pipefail

          cd apps/mobile/ios

          xcodebuild \
            -workspace Rish.xcworkspace \
            -scheme Rish \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/RishDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_IDENTITY="" \
            build

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euxo pipefail

          APP_PATH="$RUNNER_TEMP/RishDerivedData/Build/Products/Release-iphoneos/Rish.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: Rish.app was not produced by xcodebuild."
            find "$RUNNER_TEMP/RishDerivedData/Build/Products" \
              -maxdepth 4 -print || true
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/Rish.app"

          (
            cd "$RUNNER_TEMP/ipa"
            /usr/bin/zip -qry \
              "$GITHUB_WORKSPACE/Rish-unsigned.ipa" \
              Payload
          )

          test -s "$GITHUB_WORKSPACE/Rish-unsigned.ipa"
          ls -lh "$GITHUB_WORKSPACE/Rish-unsigned.ipa"

      - name: Upload IPA artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Rish-unsigned-IPA
          path: Rish-unsigned.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Upload build logs if failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Rish-iOS-build-logs
          path: |
            ${{ runner.temp }}/RishDerivedData/Logs/**
            ${{ runner.temp }}/RishDerivedData/Build/Logs/**
          if-no-files-found: ignore
          retention-days: 7
